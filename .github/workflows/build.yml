name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The published bytecode is always 17. The newer runtimes are here because L finds the
        # calling class by walking a stack trace, which is the thing most likely to shift under a
        # JDK bump.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build -PtestJavaVersion=${{ matrix.java }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-jdk${{ matrix.java }}
          path: l/build/reports/tests/
